# SCRUM-377 — Análise estática de qualidade e segurança (CodeQL).
# Roda no PR para a dev e toda segunda na dev (os alertas ficam na aba Security).
# Não repete no push da dev nem na main: o conteúdo é o mesmo analisado no PR.
name: CodeQL

on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Análise CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
