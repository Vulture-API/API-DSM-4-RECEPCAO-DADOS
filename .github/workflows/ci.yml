# ---------------------------------------------------------------------------
# SCRUM-377 — Pipeline de Integração Contínua da recepção de dados (Python)
#
# Etapas: instalação limpa -> lint (ruff) -> formatação -> testes unitários e
# de integração (MQTT e Redis descartáveis) -> Quality Gate 80%
# -> build da imagem Docker (sem push).
# ---------------------------------------------------------------------------
name: CI

# A suíte completa roda no PR para a dev: é a pipeline da feature. No push da
# dev, o job de procedência confere que entrou o mesmo conteúdo testado no PR e,
# confirmado, não repete a suíte; sem prova, roda tudo. A main não tem gatilho:
# a promoção usa o que ficou registrado no commit da dev.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

# Em PR, commit novo cancela a execução antiga; na dev, cada merge tem a sua.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "80"

jobs:
  procedencia:
    name: Procedência do commit na dev
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      testado: ${{ steps.conferir.outputs.testado }}
    steps:
      - name: Conferir se o conteúdo já foi testado no PR
        id: conferir
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const roda = (motivo) => {
              core.notice(`Suíte completa nesta execução: ${motivo}.`);
              core.setOutput('testado', 'false');
            };
            try {
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
              if (commit.parents.length !== 2) return roda('o commit não é o merge de um PR');
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
              const pr = prs.find((p) => p.merged_at && p.merge_commit_sha === sha);
              if (!pr) return roda('nenhum PR mesclado gerou este commit');
              const head = pr.head.sha;
              const [{ data: merge }, { data: testado }] = await Promise.all([
                github.rest.git.getCommit({ ...context.repo, commit_sha: sha }),
                github.rest.git.getCommit({ ...context.repo, commit_sha: head }),
              ]);
              if (merge.tree.sha !== testado.tree.sha) return roda(`o conteúdo da dev difere do commit testado no PR #${pr.number}`);
              const { data: comparacao } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${commit.parents[0].sha}...${head}`,
              });
              if (!['ahead', 'identical'].includes(comparacao.status)) return roda(`o PR #${pr.number} não estava atualizado com a dev`);
              const workflow = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow,
                head_sha: head,
                event: 'pull_request',
                status: 'success',
                per_page: 1,
              });
              const run = runs.workflow_runs[0];
              if (!run) return roda(`não há CI verde no commit ${head.slice(0, 7)} do PR #${pr.number}`);
              core.setOutput('testado', 'true');
              await core.summary
                .addHeading('Procedência confirmada', 3)
                .addRaw(`O commit ${sha.slice(0, 7)} da dev tem o mesmo conteúdo do commit ${head.slice(0, 7)}, testado no PR #${pr.number}. `)
                .addRaw('A suíte do repositório não roda de novo.')
                .addBreak()
                .addLink('Execução que testou este conteúdo', run.html_url)
                .write();
            } catch (erro) {
              roda(`não foi possível conferir (${erro.message})`);
            }

  quality:
    needs: procedencia
    # Roda no PR e em execução manual; no push da dev, só se a procedência não
    # provar que este conteúdo já passou no PR.
    if: ${{ !cancelled() && needs.procedencia.outputs.testado != 'true' }}
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage_gate.outputs.coverage }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION: "1"
      TEST_MQTT_HOST: localhost
      TEST_MQTT_PORT: "1883"
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Service containers não aceitam argumentos de comando; o Mosquitto 2
      # precisa do arquivo sem autenticação que já vem na imagem.
      - name: Subir broker MQTT
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            --health-cmd "mosquitto_pub -h localhost -t ci/health -m ok" \
            --health-interval 2s --health-timeout 5s --health-retries 15 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mosquitto)" = healthy ] && exit 0
            sleep 2
          done
          docker logs mosquitto
          echo "::error::Broker MQTT não ficou pronto."
          exit 1

      - name: Instalar dependências (clean room)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
          pip check
          python -c "import importlib.util; assert importlib.util.find_spec('asyncpg') is None; assert importlib.util.find_spec('station_ingest.persistence') is None"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Checagem de formatação
        run: ruff format --check .

      - name: Testes unitários
        run: pytest -rs -m "not integration"

      - name: Testes de integração (Mosquitto e Redis)
        run: pytest -rs -m "integration"

      - name: Cobertura total de testes
        run: |
          pytest -rs --cov --cov-report=term --cov-report=json \
            --cov-report=xml --junitxml=reports/junit.xml

      # Os testes de integração viram "skipped" se faltar um serviço ou uma
      # variável; no CI isso tem que falhar, não passar em silêncio.
      - name: Nenhum teste pulado
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          if skipped:
              print(f"::error::{skipped} teste(s) pulado(s). Confira os serviços e as variáveis TEST_* do job.")
              sys.exit(1)
          cases = list(root.iter("testcase"))
          assert cases, "No tests were reported"
          for name in ["test_main_rejects_removed_persist_before_configuration", "test_ack_follows_successful_xadd_and_retry", "test_real_retention_never_removes_pending_or_undelivered"]:
              assert any(name in c.attrib["name"] for c in cases), f"Missing {name}"
          assert any("test_real_mqtt_to_redis_round_trip" in c.attrib["name"] for c in cases)
          assert sum("test_killed_receiver_redelivers_unacked_message" in c.attrib["name"] for c in cases) == 2
          PY

      - name: Quality Gate de cobertura (DoD 80%)
        id: coverage_gate
        run: |
          COVERAGE=$(python -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "Cobertura de linhas: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "### Cobertura: ${COVERAGE}% (mínimo ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::error::FALHA: cobertura de ${COVERAGE}% não atinge a DoD (${COVERAGE_THRESHOLD}%). Merge bloqueado."
            exit 1
          fi

          echo "::notice::Quality Gate aprovado: ${COVERAGE}% de cobertura."

      - name: Build do pacote
        run: |
          pip install build
          python -m build --wheel --outdir dist/
          python -m venv "$RUNNER_TEMP/receiver-wheel"
          "$RUNNER_TEMP/receiver-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/receiver-wheel/bin/pip" check
          "$RUNNER_TEMP/receiver-wheel/bin/python" -c "import importlib.util; assert importlib.util.find_spec('asyncpg') is None; assert importlib.util.find_spec('station_ingest.persistence') is None"
          if "$RUNNER_TEMP/receiver-wheel/bin/station-ingest" persist > removed-command.log 2>&1; then
            echo "::error::O modo persist não pode executar na recepção."
            exit 1
          fi
          grep -F 'station-persist consume' removed-command.log

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: |
            reports/
            coverage.xml
            coverage.json
            dist/
          retention-days: 30
          if-no-files-found: warn

      - name: Encerrar broker descartável
        if: always()
        run: docker rm -f mosquitto || true

  docker:
    name: Validar build da imagem Docker
    runs-on: ubuntu-24.04
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build da imagem (sem push)
        run: |
          image_tag="api-dsm-4-recepcao-dados:ci-${{ github.sha }}"
          docker build -t "$image_tag" .
          test "$(docker run --rm --entrypoint id "$image_tag" -u)" != 0
          docker run --rm --entrypoint python "$image_tag" -c "import importlib.util; assert importlib.util.find_spec('asyncpg') is None; assert importlib.util.find_spec('station_ingest.persistence') is None"
          if docker run --rm --network none "$image_tag" persist > removed-command.log 2>&1; then
            echo "::error::O modo persist não pode executar na recepção."
            exit 1
          fi
          grep -F 'station-persist consume' removed-command.log

  comment:
    name: Comentar resultado no PR
    runs-on: ubuntu-24.04
    needs: [quality, docker]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Criar ou atualizar o comentário do CI
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
          COVERAGE: ${{ needs.quality.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- vulture-ci-report -->';
            const ok = process.env.QUALITY === 'success' && process.env.DOCKER === 'success';
            const coverage = process.env.COVERAGE || 'n/d';
            const body = [
              marker,
              `${ok ? '✅' : '❌'} **Pipeline de CI: ${ok ? 'aprovado' : 'reprovado'}**`,
              '',
              `- Lint, testes e build: \`${process.env.QUALITY}\``,
              `- Imagem Docker: \`${process.env.DOCKER}\``,
              `- Cobertura de linhas: **${coverage}%** (mínimo ${process.env.COVERAGE_THRESHOLD}%)`,
              `- Commit: \`${context.payload.pull_request.head.sha.substring(0, 7)}\``,
              `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
