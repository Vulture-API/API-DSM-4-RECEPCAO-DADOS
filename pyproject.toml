[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "station-ingest"
version = "0.1.0"
description = "High-throughput MQTT to Redis Streams ingestion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "asyncpg>=0.30,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis[hiredis]>=5.2,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "aiomqtt>=2.5,<3",
]
lint = ["ruff>=0.11,<1"]

[project.scripts]
station-ingest = "station_ingest.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/station_ingest"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires externally provided MQTT and Redis services",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["station_ingest"]

[tool.coverage.report]
fail_under = 80

